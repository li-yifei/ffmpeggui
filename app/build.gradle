plugins {
    id 'com.android.application'
}

def generatedLegalAssetsDir = layout.buildDirectory.dir('generated/legalAssets').get().asFile
def bundledAioFfmpeg = file('src/main/libs/arm64-v8a/libffmpeg.so')
def aioVerifier = rootProject.file('native/ffmpeg/verify-android-arm64-aio.sh')
def bundledAioSha256 = '3435fbd16c5d2ba37a790c155bd2274fc0d3c2ccc755af49b828511837fa4504'
def pinnedNdkVersion = '29.0.14206865'
def localPropertiesFile = rootProject.file('local.properties')
def configuredSdkDirectory = providers.provider {
    def environmentSdk = System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME')
    if (environmentSdk) {
        return file(environmentSdk)
    }
    if (localPropertiesFile.isFile()) {
        def localProperties = new Properties()
        localPropertiesFile.withInputStream { localProperties.load(it) }
        def sdkDir = localProperties.getProperty('sdk.dir')
        if (sdkDir) {
            return file(sdkDir)
        }
    }
    return null
}

def verifyBundledAioFfmpeg = tasks.register('verifyBundledAioFfmpeg', Exec) {
    inputs.file bundledAioFfmpeg
    inputs.file aioVerifier
    environment 'EXPECTED_AIO_SHA256', bundledAioSha256
    doFirst {
        if (!System.getenv('ANDROID_NDK_ROOT')) {
            def sdkDirectory = configuredSdkDirectory.getOrNull()
            if (sdkDirectory != null) {
                environment 'ANDROID_NDK_ROOT',
                        new File(sdkDirectory, "ndk/${pinnedNdkVersion}").absolutePath
            }
        }
    }
    commandLine aioVerifier.absolutePath, bundledAioFfmpeg.absolutePath
}

def generateLegalAssets = tasks.register('generateLegalAssets', Sync) {
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        into 'legal'
    }
    from(rootProject.file('third_party/licenses')) {
        // Preserve THIRD_PARTY_NOTICES.md's repository-relative link target
        // when the notice is read from assets/legal inside an APK.
        into 'legal/third_party/licenses'
    }
    into generatedLegalAssetsDir
}

android {
    namespace 'com.silentlexx.ffmpeggui_os'
    compileSdk 36
    ndkVersion pinnedNdkVersion

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId 'com.silentlexx.ffmpeggui_os'
        minSdk 26
        targetSdk 35
        versionCode 9002001
        versionName '9.0.2-modern1'

        ndk {
            abiFilters 'arm64-v8a'
        }

        bundle {
            language {
                enableSplit = false
            }
            density {
                enableSplit = true
            }
            abi {
                enableSplit = true
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            excludes += ['**/libffmpeglite.so', '**/libhelloJNI.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError true
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', generatedLegalAssetsDir]
            jniLibs.srcDirs = ['src/main/libs']
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn verifyBundledAioFfmpeg
}

tasks.configureEach { task ->
    if (task.name ==~ /merge.*Assets/ || task.name.toLowerCase().contains('lint')) {
        task.dependsOn generateLegalAssets
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    testImplementation 'junit:junit:4.13.2'
}
